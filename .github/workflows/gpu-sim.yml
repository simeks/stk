name: GPU Simulator

# The hosted runners have no GPU, so this builds STK with CUDA enabled and runs
# the Catch test suite, including the CUDA and GPU tests, on a simulated NVIDIA
# H100 (https://github.com/pantheongpu/pantheonsim). A simulator cannot
# reproduce hardware-specific behavior or timing, so it complements real-GPU
# testing and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [ development ]
    paths:
      - "src/**"
      - "test/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@a1b9d4237411f9b2b0e0bb895b4d83377f336a7b # v0.1.9
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # The simulator runs PTX and needs a shared CUDA runtime, hence
      # 90-virtual and CMAKE_CUDA_RUNTIME_LIBRARY=Shared.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.0/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
            -DSTK_USE_CUDA=ON \
            -DSTK_BUILD_TESTS=ON \
            -DSTK_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build -j3

      # io_vtk_2d is excluded: it also fails on the host without the simulator
      # (read_volume("test_2d_image.vtk") returns an invalid volume).
      - name: Test
        working-directory: test
        run: vgpu run ../build/test/stk_test "~io_vtk_2d"
